[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcejob"
version = "0.1.0"
description = "Training and evaluation jobs on ephemeral Google Cloud VMs (Cloud Batch backend)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "typer>=0.12",
    "google-cloud-batch>=0.17",
    "google-cloud-logging>=3.9",
    "google-cloud-storage>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gcejob = "gcejob.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gcejob"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
